name: smart-energy

services:
  ai:
    build:
      context: ./ai
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/model/info")
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      ML_SERVICE_URL: http://ai:8000
      AI_SAMPLE_DATA_PATH: /app/ai/household_daily_clean.csv
      SQLITE_DB_PATH: /app/data/smart-energy.sqlite
      ALLOW_DUMMY_PREDICTION: "false"
      ENABLE_DEMO_ENDPOINT: "false"
      JWT_SECRET: ${JWT_SECRET}
      TARIFF_PER_KWH: ${TARIFF_PER_KWH:-1444.7}
    volumes:
      - backend_data:/app/data
    expose:
      - "5000"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:5000/api/health").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  caddy_data:
  caddy_config:
